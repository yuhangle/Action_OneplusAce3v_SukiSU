name: Build Kernel ReSukiSU with 4.19 kernel (Mi Pad 4)

on:
  workflow_dispatch:
    inputs:
      KERNEL_NAME:
        description: '自定义内核名称'
        required: false
        default: 'SouthWest-NG'
      CUSTOM_NAME_ENABLED:
        description: '是否启用自定义内核名 (禁用此选项将不添加内核名后缀)'
        required: true
        default: false
        type: boolean
      DROID_SPACES_ENABLED:
        description: '是否加入DroidSpaces支持 (true/false)'
        required: true
        default: false
        type: boolean
      ENABLE_SUSFS:
        description: '是否启用susfs (true/false)'
        required: true
        default: false
        type: boolean
      USE_FAKE_TIME:
        description: '是否伪造构建时间 (true/false)'
        required: true
        default: false
        type: boolean
      FAKE_TIME_VAL:
        description: '伪造的时间戳 (仅当启用伪造时间时生效)'
        required: false
        default: 'Sat Aug 1 00:00:00 UTC 2026'

jobs:
  build:
    runs-on: ubuntu-22.04
    
    env:
      # CCACHE 配置 (4G 安全限制)
      CCACHE_DIR: ${{ github.workspace }}/.ccache_dir
      CCACHE_MAXSIZE: 4G 
      CCACHE_NOHASHDIR: 'true'
      CCACHE_HARDLINK: 'true'
      CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'

    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 8192
        temp-reserve-mb: 2048
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        
    - name: Checkout Workflow
      uses: actions/checkout@v4

    - name: Create and Enable 4G Swap
      run: |
        sudo swapoff -a
        sudo fallocate -l 4G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libelf-dev libssl-dev flex bison cpio dwarves bc ccache
        sudo apt-get install -y git gnupg gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev unzip python3 python3-pip
        
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"

    - name: Restore Ccache (Skipping Save)
      uses: actions/cache@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        # 修复后的 Key 定义，直接在 step 中引用 ${{ runner.os }} 和 ${{ hashFiles(...) }}
        key: ccache-${{ runner.os }}-${{ hashFiles('kernel_workspace/kernel_platform/common/build.config*') }}-v2-${{ github.event.inputs.KERNEL_NAME }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ hashFiles('kernel_workspace/kernel_platform/common/build.config*') }}-v2-
          ccache-${{ runner.os }}-

    - name: Initialize Ccache
      run: |
        if command -v ccache >/dev/null 2>&1; then
          echo "CCACHE 目录: ${{ env.CCACHE_DIR }}"
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M ${{ env.CCACHE_MAXSIZE }}
          echo "✅ ccache 初始化完成"
        else
          echo "❌ 未安装 ccache，跳过"
        fi
        ccache -s

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: ⬇️ Download Google Clang Toolchain
      # 步骤1：创建目录
      run: |
        # 创建工具链目录
        TC_ROOT="$GITHUB_WORKSPACE/kernel_workspace/build-tools"
        TC="$TC_ROOT/clang-r563880c"

        mkdir -p "$TC"
        cd "$TC_ROOT"

        echo "Downloading Clang r563880c..."

        curl -fL --retry 3 \
          -o clang-r563880c.tar.gz \
          'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/1dfd3e02af21d5427d427f902e718bf4db58e0ae/clang-r563880c.tar.gz'

        echo "Extracting Clang toolchain..."
        tar -xzf clang-r563880c.tar.gz -C "$TC"

        # 删除压缩包，减少工作区占用
        rm -f clang-r563880c.tar.gz

        # 设置 GitHub Actions 后续步骤使用的环境变量
        echo "CLANG_PATH=$TC/bin" >> "$GITHUB_ENV"
        echo "TC=$TC" >> "$GITHUB_ENV"

        # 当前步骤立即生效
        export PATH="$TC/bin:$PATH"
        export CLANG_PATH="$TC/bin"

        echo "Clang toolchain installed at: $TC"
        "$TC/bin/clang" --version


    - name: Initialize & Sync Kernel Source
      run: |
        set -euo pipefail

        WORKSPACE="$GITHUB_WORKSPACE/kernel_workspace"
        REPO_DIR="$WORKSPACE/common"

        cd "$WORKSPACE"

        if [[ "${{ steps.cache-kernel.outputs.cache-hit }}" != "true" ]]; then
          echo "[*] 缓存未命中，开始同步内核源码..."

          rm -rf "$REPO_DIR"
          mkdir -p "$REPO_DIR"
          cd "$REPO_DIR"

          git init
          git remote add origin \
            https://github.com/pix106/android_kernel_xiaomi_sdm660_southwest-ng.git

          git fetch --depth=1 origin 0.17.3
          git checkout -b 0.17.3 FETCH_HEAD

          echo "[*] 内核源码同步完成"
          echo "[*] 当前提交：$(git rev-parse HEAD)"
          echo "[*] 当前分支：$(git branch --show-current)"
        else
          echo "[*] 源码缓存命中，跳过同步"
          fi

        
    - name: Configure and Build 4.19 Kernel with ReSukiSU
      env:
        KERNEL_DIR: ${{ github.workspace }}/kernel_workspace/common
        DROID_SPACES_ENABLED: ${{ inputs.DROID_SPACES_ENABLED }}
        ENABLE_SUSFS: ${{ inputs.ENABLE_SUSFS }}
      run: |
        set -euo pipefail

        cd "$KERNEL_DIR"

        # 使用前面下载的 Clang 工具链
        export PATH="/usr/lib/ccache:$CLANG_PATH:$PATH"

        export ARCH=arm64
        export LLVM=1
        export LLVM_IAS=1
        export LOCALVERSION=-clo

        echo "[*] Clang version:"
        clang --version

        echo "[*] Generating device defconfig..."
        make O=out vendor/xiaomi/sdm660_defconfig

        echo "[*] Applying clover config..."
        make O=out vendor/xiaomi/clover.config

        echo "[*] Integrating ReSukiSU..."
        
        curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

        # 计算并导出 KSU 版本号
        cd KernelSU
        KSU_VERSION=$(( $(git rev-list --count main) + 30700 ))
        echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"
        echo "[*] KSU_VERSION=$KSU_VERSION"
        cd ..

        if [[ "$ENABLE_SUSFS" == "true" ]]; then
            wget https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/Patch/susfs_patch_to_4.19.patch

            patch -p1 < susfs_patch_to_4.19.patch || true
            # 失败需要手动补丁
            wget https://raw.githubusercontent.com/yuhangle/Action_OneplusAce3v_SukiSU/refs/heads/master/patch/ksu/sdm660_susfs_fix.patch
            git apply ./sdm660_susfs_fix.patch

            wget https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/susfs_inline_hook_patches.sh
            bash susfs_inline_hook_patches.sh ./

            # 打上符号导出需要的补丁
            wget https://raw.githubusercontent.com/yuhangle/Action_OneplusAce3v_SukiSU/refs/heads/master/patch/ksu/sdm660_resuki_selinux.patch
            patch -p1 < ./sdm660_resuki_selinux.patch

            # SUSFS配置
            scripts/config --file out/.config \
                --enable KSU \
                --enable KSU_SUSFS \
                --enable KSU_SUSFS_SUS_PATH \
                --enable KSU_SUSFS_SUS_MOUNT \
                --enable KSU_SUSFS_SUS_KSTAT \
                --enable KSU_SUSFS_SPOOF_UNAME \
                --enable KSU_SUSFS_ENABLE_LOG \
                --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
                --enable KSU_SUSFS_OPEN_REDIRECT \
                --disable KSU_TRACEPOINT_HOOK \
                --disable KSU_MANUAL_HOOK \
                --enable KSU_SUSFS_SUS_MAP
        
        else
            # 打ReSukiSU MANUAL_HOOK补丁

            curl -LSs "https://raw.githubusercontent.com/yuhangle/Action_OneplusAce3v_SukiSU/refs/heads/master/patch/ksu/sdm660_resuki.patch" -o sdm660_resuki.patch
            git apply ./sdm660_resuki.patch

            echo "[*] Applying KSU configuration..."
            scripts/config --file out/.config \
              --enable KSU \
              --disable KSU_SUSFS \
              --disable KSU_TRACEPOINT_HOOK \
              --enable KSU_MANUAL_HOOK
        fi

        # 加入DroidSpaces支持
        if [[ "$DROID_SPACES_ENABLED" == "true" ]]; then
            # 开启droidspaces配置
            scripts/config --file out/.config \
                --enable SYSCTL \
                --enable SYSVIPC \
                --enable POSIX_MQUEUE \
                \
                --enable NAMESPACES \
                --enable PID_NS \
                --enable UTS_NS \
                --enable IPC_NS \
                --enable USER_NS \
                \
                --enable SECCOMP \
                --enable SECCOMP_FILTER \
                \
                --enable CGROUPS \
                --enable CGROUP_DEVICE \
                --enable CGROUP_PIDS \
                --disable MEMCG \
                --enable CGROUP_SCHED \
                --enable FAIR_GROUP_SCHED \
                --enable CGROUP_FREEZER \
                --enable CGROUP_NET_PRIO \
                \
                --enable DEVTMPFS \
                \
                --enable OVERLAY_FS \
                --enable TMPFS_POSIX_ACL \
                --enable TMPFS_XATTR \
                \
                --enable FW_LOADER \
                --enable FW_LOADER_USER_HELPER \
                --enable FW_LOADER_COMPRESS \
                \
                --enable NET_NS \
                --enable VETH \
                --enable BRIDGE \
                --enable NETFILTER \
                --enable BRIDGE_NETFILTER \
                --enable NETFILTER_ADVANCED \
                --enable NF_CONNTRACK \
                --enable IP_NF_IPTABLES \
                --enable IP_NF_FILTER \
                --enable NF_NAT \
                --enable NF_TABLES \
                --enable IP_NF_TARGET_MASQUERADE \
                --enable NETFILTER_XT_TARGET_MASQUERADE \
                --enable NETFILTER_XT_TARGET_TCPMSS \
                --enable NETFILTER_XT_MATCH_ADDRTYPE \
                --enable NF_CONNTRACK_NETLINK \
                --enable NF_NAT_REDIRECT \
                --enable IP_ADVANCED_ROUTER \
                --enable IP_MULTIPLE_TABLES \
                \
                --enable NF_CONNTRACK_IPV4 \
                --enable NF_NAT_IPV4 \
                --enable IP_NF_NAT \
                \
                --disable ANDROID_PARANOID_NETWORK
            # 打补丁
            wget https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/refs/heads/main/Documentation/resources/kernel-patches/non-GKI/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch
            patch -p1 -F3 < ./"02.fix_restore cgroup file prefix handling .patch"
        fi

        echo "[*] Synchronizing kernel configuration..."
        make LLVM=1 LLVM_IAS=1 ARCH=arm64 \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            HOSTCXX="ccache clang++" \
            O=out olddefconfig

        echo "[*] Checking KSU configuration..."
        grep -E 'CONFIG_KSU|CONFIG_KALLSYMS' out/.config || true
        
        echo "[*] Build Kernel"

        make LLVM=1 LLVM_IAS=1 ARCH=arm64 \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            HOSTCXX="ccache clang++" \
            O=out -j8 Image.gz-dtb


        echo "[*] Build completed."
        ls -lh out/arch/arm64/boot/Image.gz-dtb


    - name: Pack Kernel with AnyKernel3
      env:
        KERNEL_DIR: ${{ github.workspace }}/kernel_workspace/common
        AK3_DIR: ${{ github.workspace }}/kernel_workspace/AnyKernel3
      run: |
        set -euo pipefail

        IMAGE_PATH="$KERNEL_DIR/out/arch/arm64/boot/Image.gz-dtb"
        WORK_DIR="$GITHUB_WORKSPACE/kernel_workspace"
        PATCH_PATH="$WORK_DIR/pix-ak3-text.patch"

        if [[ ! -f "$IMAGE_PATH" ]]; then
          echo "Error: Image.gz-dtb not found at $IMAGE_PATH"
          exit 1
        fi

        echo "[*] Image.gz-dtb found:"
        ls -lh "$IMAGE_PATH"

        cd "$WORK_DIR"

        rm -rf "$AK3_DIR"

        git clone --depth=1 \
          https://github.com/osm0sis/AnyKernel3.git \
          "$AK3_DIR"

        wget -O "$PATCH_PATH" \
          "https://raw.githubusercontent.com/yuhangle/Action_OneplusAce3v_SukiSU/refs/heads/master/patch/other/pix-ak3-text.patch"

        echo "[*] Applying AnyKernel3 patch..."
        patch -p0 < "$PATCH_PATH"

        echo "[*] Patched device configuration:"
        grep -E \
          'device.name|supported.versions|supported.patchlevels|supported.vendorpatchlevels|BLOCK|IS_SLOT_DEVICE|RAMDISK_COMPRESSION|PATCH_VBMETA_FLAG' \
          "$AK3_DIR/anykernel.sh" || true

        echo "[*] Copying Image.gz-dtb to AnyKernel3..."
        cp "$IMAGE_PATH" "$AK3_DIR/Image.gz-dtb"

        ls -lh "$AK3_DIR/Image.gz-dtb"

        echo "AK3_UPLOAD_PATH=$AK3_DIR" >> "$GITHUB_ENV"

        echo "[*] AnyKernel3 directory is ready."


    - name: Upload AnyKernel3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AnyKernel3-ReSukiSU-${{ env.KSU_VERSION }}-${{ inputs.ENABLE_SUSFS == true && 'susfs' || 'nosusfs' }}
        path: ${{ env.AK3_UPLOAD_PATH }}
        if-no-files-found: error

